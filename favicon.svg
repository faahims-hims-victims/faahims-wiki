<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="FAAHIMS.wiki compass mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="0.55" stop-color="#1a3a5c"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#a5d8ff" stroke-width="3" opacity="0.9"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#a5d8ff" stroke-width="1" opacity="0.35"/>
  <!-- compass rose: N-S needle emphasized, E-W secondary -->
  <polygon points="64,18 72,64 64,54 56,64" fill="#ffffff"/>
  <polygon points="64,110 56,64 64,74 72,64" fill="#9fb3c8"/>
  <polygon points="18,64 64,56 58,64 64,72" fill="#dbe8fb" opacity="0.85"/>
  <polygon points="110,64 64,72 70,64 64,56" fill="#dbe8fb" opacity="0.85"/>
  <circle cx="64" cy="64" r="5.5" fill="#ffffff"/>
  <circle cx="64" cy="64" r="2.4" fill="#1a3a5c"/>
</svg>
