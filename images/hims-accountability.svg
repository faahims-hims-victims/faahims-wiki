<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 800" width="950" height="800">
  <title>HIMS Program: Data Accountability Structure</title>
  <desc>Diagram showing HIMS stakeholder relationships and data accountability. Source: National Academies (2023). Licensed under CC-BY-SA 4.0.</desc>
  
  <!-- Background -->
  <rect width="950" height="800" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="475" y="35" font-family="Georgia, serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Where Is the Data?</text>
  <text x="475" y="58" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555555">HIMS Program Structure and Accountability</text>
  
  <!-- ==================== ARROW MARKERS ==================== -->
  
  <defs>
    <marker id="arrowBlackBig" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,12 L16,6 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowGrayBig" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,12 L16,6 z" fill="#777777"/>
    </marker>
  </defs>
  
  <!-- ==================== CONTROL ARROWS (render behind) ==================== -->
  
  <!-- FAA to Pilot -->
  <path d="M 50 200 C 5 400, 5 560, 350 645" stroke="#1a1a1a" stroke-width="2.5" fill="none" marker-end="url(#arrowBlackBig)"/>
  
  <!-- ALPA to Pilot (thicker) -->
  <path d="M 900 200 C 945 400, 945 560, 600 645" stroke="#1a1a1a" stroke-width="3" fill="none" marker-end="url(#arrowBlackBig)"/>
  
  <!-- Airlines to Pilot -->
  <line x1="165" y1="590" x2="355" y2="648" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrowBlackBig)"/>
  
  <!-- HIMS AME to Pilot -->
  <line x1="785" y1="590" x2="595" y2="648" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrowBlackBig)"/>
  
  <!-- ==================== FAA-ALPA CONNECTION (double line = contract) ==================== -->
  
  <line x1="250" y1="152" x2="700" y2="152" stroke="#333333" stroke-width="3"/>
  <line x1="250" y1="160" x2="700" y2="160" stroke="#333333" stroke-width="3"/>
  
  <!-- Connection label -->
  <rect x="355" y="132" width="240" height="45" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
  <text x="475" y="152" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">FAA/ALPA CONTRACT</text>
  <text x="475" y="168" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">"FAA owns data; ALPA maintains database"</text>
  
  <!-- ==================== FOUR STAKEHOLDER BOXES ==================== -->
  
  <!-- FAA Box -->
  <rect x="50" y="100" width="200" height="125" rx="5" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FAA</text>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">Federal Aviation Administration</text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">"Funds core elements" — NAS 2023</text>
  <text x="150" y="188" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">"Owns the data" — NAS 2023</text>
  <text x="150" y="208" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">"Full access would not be provided"</text>
  
  <!-- ALPA Box -->
  <rect x="700" y="100" width="200" height="125" rx="5" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="800" y="130" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ALPA</text>
  <text x="800" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">Air Line Pilots Association</text>
  <text x="800" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">"Maintains HIMS database" — NAS 2023</text>
  <text x="800" y="188" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">"Runs training &amp; himsprogram.com"</text>
  <text x="800" y="208" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">Pilot's own union</text>
  
  <!-- Airlines Box -->
  <rect x="50" y="470" width="200" height="120" rx="5" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="150" y="502" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AIRLINES</text>
  <text x="150" y="522" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">Part 121 Carriers</text>
  <text x="150" y="545" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">"Maintain managerial</text>
  <text x="150" y="560" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">functions" — NAS 2023</text>
  
  <!-- HIMS AMEs Box -->
  <rect x="700" y="470" width="200" height="120" rx="5" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="800" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">HIMS AMEs</text>
  <text x="800" y="518" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">Aviation Medical Examiners</text>
  <text x="800" y="540" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">Claim: "No doctor-patient</text>
  <text x="800" y="555" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c0392b" font-weight="bold">relationship exists"</text>
  <text x="800" y="575" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555555">"We represent the FAA"</text>
  
  <!-- ==================== CENTRAL DATA VOID ==================== -->
  
  <ellipse cx="475" cy="370" rx="80" ry="58" fill="#fafafa" stroke="#777777" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="475" y="350" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#444444">OUTCOME</text>
  <text x="475" y="373" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#444444">DATA</text>
  <text x="475" y="410" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#c0392b">?</text>
  
  <!-- ==================== DEFLECTION ARROWS ==================== -->
  
  <!-- FAA deflection -->
  <path d="M 250 165 Q 320 235 395 323" stroke="#777777" stroke-width="2.5" stroke-dasharray="8,4" fill="none" marker-end="url(#arrowGrayBig)"/>
  <rect x="280" y="230" width="105" height="44" rx="4" fill="#ededed" stroke="#888888" stroke-width="1.5"/>
  <text x="332" y="249" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">"We don't centrally</text>
  <text x="332" y="264" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">administer HIMS"</text>
  
  <!-- ALPA deflection -->
  <path d="M 700 165 Q 630 235 555 323" stroke="#777777" stroke-width="2.5" stroke-dasharray="8,4" fill="none" marker-end="url(#arrowGrayBig)"/>
  <rect x="565" y="230" width="105" height="44" rx="4" fill="#ededed" stroke="#888888" stroke-width="1.5"/>
  <text x="617" y="249" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">"FAA handles</text>
  <text x="617" y="264" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">certification"</text>
  
  <!-- Airlines deflection -->
  <path d="M 250 525 Q 320 480 395 417" stroke="#777777" stroke-width="2.5" stroke-dasharray="8,4" fill="none" marker-end="url(#arrowGrayBig)"/>
  <rect x="280" y="460" width="105" height="44" rx="4" fill="#ededed" stroke="#888888" stroke-width="1.5"/>
  <text x="332" y="479" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">"We follow union/</text>
  <text x="332" y="494" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">FAA protocols"</text>
  
  <!-- HIMS AME deflection -->
  <path d="M 700 525 Q 630 480 555 417" stroke="#777777" stroke-width="2.5" stroke-dasharray="8,4" fill="none" marker-end="url(#arrowGrayBig)"/>
  <rect x="565" y="460" width="105" height="44" rx="4" fill="#ededed" stroke="#888888" stroke-width="1.5"/>
  <text x="617" y="479" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">"We don't control</text>
  <text x="617" y="494" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">the database"</text>
  
  <!-- ==================== PILOT BOX ==================== -->
  
  <rect x="350" y="625" width="250" height="80" rx="5" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="475" y="655" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">PILOT</text>
  <text x="475" y="677" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333333">HIMS Participant</text>
  <text x="475" y="697" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">Beholden to ALL — can upset NONE</text>
  
  <!-- ==================== BOTTOM FINDING BOX ==================== -->
  
  <rect x="200" y="720" width="550" height="70" rx="5" fill="#fff5f5" stroke="#c0392b" stroke-width="2"/>
  <text x="475" y="742" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">NATIONAL ACADEMIES FINDING (2023)</text>
  <text x="475" y="762" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">"Those aggregate data were never delivered." — Appendix C</text>
  <text x="475" y="780" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">When Congress mandated review: <tspan font-weight="bold" fill="#c0392b">NEITHER provided the data</tspan></text>
  
  <!-- ==================== LEGEND (top right corner, clear of all elements) ==================== -->
  
  <rect x="835" y="720" width="105" height="70" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="887" y="738" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333333">Legend</text>
  
  <!-- Double line = contract -->
  <line x1="842" y1="752" x2="865" y2="752" stroke="#333333" stroke-width="2"/>
  <line x1="842" y1="757" x2="865" y2="757" stroke="#333333" stroke-width="2"/>
  <text x="872" y="756" font-family="Arial, sans-serif" font-size="9" fill="#333333">Contract</text>
  
  <!-- Deflection - dashed -->
  <line x1="842" y1="768" x2="865" y2="768" stroke="#777777" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="872" y="771" font-family="Arial, sans-serif" font-size="9" fill="#333333">Deflection</text>
  
  <!-- Control - solid -->
  <line x1="842" y1="782" x2="865" y2="782" stroke="#1a1a1a" stroke-width="2"/>
  <text x="872" y="785" font-family="Arial, sans-serif" font-size="9" fill="#333333">Control</text>
  
</svg>
